name: Testes ao vivo

# A ilha lê o manifest do anvisa-api ao vivo, no navegador: uma mudança lá chega ao site publicado sem
# rebuild. O pages.yml roda os testes sem os dados reais, então test/derivadas-live.test.ts fica de fora
# dele. Este workflow baixa o build publicado (todas as tabelas do manifest, ~76 MB em 2026-11-03) e roda a
# suíte com DADOS_LIVE: fica vermelho quando o anvisa-api muda algo que o contém lê. Não publica nada.

on:
  schedule:
    - cron: "15 6 * * *" # 03h15 em Brasília, depois do dados.yml do anvisa-api
  workflow_dispatch:

permissions: {} # só lê o repositório público e URLs públicas

defaults:
  run:
    shell: bash

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Baixar o build publicado
        env:
          BASE: https://vasfvitor.github.io/anvisa-api
        run: |
          dir="$RUNNER_TEMP/dados"
          mkdir -p "$dir"
          # ?t= fura o cache de 600 s do Pages
          curl -fsSL --retry 3 "$BASE/manifest.json?t=$(date +%s)" -o "$RUNNER_TEMP/manifest.json"
          echo "build $(jq -r .build_id "$RUNNER_TEMP/manifest.json")"
          jq -r '.tables | to_entries[] | "\(.key) \(.value.path)"' "$RUNNER_TEMP/manifest.json" |
            while read -r nome caminho; do
              curl -fsSL --retry 3 "$BASE/$caminho" -o "$dir/$nome.parquet"
            done
          du -sh "$dir"

      # com DADOS_LIVE, faltar tabela é erro (o teste não pula em silêncio)
      - name: Testes com os dados reais
        env:
          DADOS_LIVE: ${{ runner.temp }}/dados
        run: pnpm test
