name: Publicar site

# A busca lê o manifest ao vivo e não depende de rebuild. O cron existe para o que o build gera a partir dos
# dados: as páginas de empresa, o llms.txt, o dicionário, o "sobre" e o rodapé. O pipeline de dados (anvisa-api) agenda 21:00 UTC, mas o
# GitHub atrasa crons em até horas e o pipeline pula dias sem dados novos: em vez de adivinhar a hora, o
# cron passa algumas vezes à noite e só publica quando o build_id do manifest difere do que o site usou
# (/build.json). Push e disparo manual publicam sempre.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * *" # 19h30 em Brasília
    - cron: "30 1 * * *" # 22h30
    - cron: "30 4 * * *" # 01h30
  workflow_dispatch:

# Menor privilégio: nada por padrão; cada job pede só o escopo que usa.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # só lê URLs públicas
    outputs:
      mudou: ${{ steps.comparar.outputs.mudou }}
    steps:
      - name: Comparar o build do manifest com o do site
        id: comparar
        env:
          EVENTO: ${{ github.event_name }}
          # os mesmos de src/lib/config.ts e de site em astro.config.mjs
          MANIFEST: https://vasfvitor.github.io/anvisa-api/manifest.json
          PUBLICADO: https://contem.abelhaninja.de/build.json
        run: |
          if [ "$EVENTO" != schedule ]; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ?t= fura o cache de 600 s do Pages; uma falha conta como mudança (publica)
          novo=$(curl -fsS "$MANIFEST?t=$(date +%s)" | jq -r .build_id) || novo=""
          site=$(curl -fsS "$PUBLICADO?t=$(date +%s)" | jq -r .build_id) || site=""
          echo "manifest: ${novo:-?} · site: ${site:-?}"
          if [ -n "$novo" ] && [ "$novo" != null ] && [ "$novo" = "$site" ]; then
            echo "unchanged: build $novo is current"
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: verificar
    if: needs.verificar.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # só lê o repositório
      pages: write # publica no GitHub Pages
      id-token: write # OIDC exigido por deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # este job não empurra nada

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Depois do pnpm: `cache: pnpm` precisa do pnpm no PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # formatação e lint antes de tudo: falham rápido e sem rede (lint roda astro sync antes)
      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm test

      # check e build leem o manifest de produção (PUBLIC_MANIFEST_URL vazio usa o padrão de config.ts)
      - run: pnpm check

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
